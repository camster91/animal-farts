name: PootBox UI checks
on:
  push:
    branches: [codex/pootbox-ui-cleanup]
permissions:
  contents: read
concurrency:
  group: pootbox-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix server --no-audit --no-fund
      - run: npm run lint && npm run build && npm run test:build
      - run: node --test --test-concurrency=1 --test-timeout=30000 tests/unit-*.test.mjs tests/server-integration.test.mjs tests/server-social-disabled.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pootbox-ui-checks
          path: .artifacts/playwright
          if-no-files-found: ignore
          retention-days: 7
