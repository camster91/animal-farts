name: Cloudflare API
on:
  pull_request:
    paths: ['cloudflare/**', 'scripts/build-cloudflare.mjs', 'tests/cloudflare.test.mjs', 'server/moderation.js', '.github/workflows/cloudflare.yml']
  push:
    branches: [codex/cloudflare-deployment]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: node --test tests/cloudflare.test.mjs
  live-smoke:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: node scripts/smoke-cloudflare.mjs
