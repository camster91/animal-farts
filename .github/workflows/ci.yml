name: CI Build

# Release gate for Animal Farts (Vite/React frontend + Express/SQLite server).
# Validate lint, tests, production build, and server syntax on every PR.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Install server dependencies
        working-directory: server
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint
        env:
          CI: true

      - name: Compile test targets
        run: npm run test:build
        env:
          CI: true

      - name: Test
        run: node --test --test-concurrency=1 --test-timeout=60000 tests/unit-*.test.mjs tests/server-integration.test.mjs
        env:
          CI: true

      - name: Build frontend
        run: npm run build
        env:
          NODE_ENV: production
          CI: true

      - name: Syntax check server
        working-directory: server
        run: node --check server.js

