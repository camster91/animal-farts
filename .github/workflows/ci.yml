name: CI Build

# Release gate for Animal Farts (Vite/React frontend + Express/SQLite server).
# Fast checks run for every relevant PR; expensive browser journeys are skipped
# for Dependabot because dependency PRs still receive lint/build/unit coverage.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Install server dependencies
        working-directory: server
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browser
        if: github.actor != 'dependabot[bot]'
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint
        env:
          CI: true

      - name: Compile test targets
        run: npm run test:build
        env:
          CI: true

      - name: Build frontend
        run: npm run build
        env:
          NODE_ENV: production
          CI: true

      - name: Test
        run: node --test --test-concurrency=1 --test-timeout=30000 tests/unit-*.test.mjs tests/server-integration.test.mjs tests/server-social-disabled.test.mjs
        env:
          CI: true

      - name: Test core PWA journeys
        if: github.actor != 'dependabot[bot]'
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright diagnostics
        if: failure() && github.actor != 'dependabot[bot]'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-diagnostics
          path: .artifacts/playwright
          if-no-files-found: ignore
          retention-days: 7

      - name: Syntax check server
        working-directory: server
        run: node --check server.js
