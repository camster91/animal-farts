name: CI Build

# Release gate for Animal Farts (Vite/React frontend + Express/SQLite server).
# Validate lint, tests, production build, and server syntax on every PR.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Install server dependencies
        working-directory: server
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint
        env:
          CI: true

      - name: Compile test targets
        run: npm run test:build
        env:
          CI: true

      # The server integration suite verifies the production SPA/static routes,
      # so dist/ must exist before the server subprocess starts.
      - name: Build frontend
        run: npm run build
        env:
          NODE_ENV: production
          CI: true

      - name: Test
        run: node --test --test-concurrency=1 --test-timeout=30000 tests/unit-*.test.mjs tests/server-integration.test.mjs tests/server-social-disabled.test.mjs
        env:
          CI: true

      - name: Test core PWA journeys
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-diagnostics
          path: .artifacts/playwright
          if-no-files-found: ignore
          retention-days: 7

      - name: Syntax check server
        working-directory: server
        run: node --check server.js
